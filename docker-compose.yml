services:
  ai-antispam:
    image: ${GHCR_IMAGE:-ghcr.io/leshchenko1979/ai-antispam}:${IMAGE_TAG:-main}
    container_name: ai-antispam
    # aiogram 3.30 alone needs ~234 MiB (it compiles the entire Bot API as
    # pydantic models); idle footprint is ~293 MiB. A 256mb limit caused an OOM
    # crash-loop (RestartCount=9) -> webhook retries -> "duplicate taps".
    # See docs/memos/2026-08-01-aiogram-memory-memo.md. Do not lower below 512mb.
    mem_limit: 512mb
    mem_reservation: 128mb
    cpus: 0.5
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    networks:
      - traefik-public
    volumes:
      - ${LOGS_DIR:-/home/${REMOTE_USER:-root}/logs}:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 1
      start_period: 60s

networks:
  traefik-public:
    external: true