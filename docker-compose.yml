# Deployment spec for ai-antispam.
#
# This file is SHIPPED BY CI, not edited on the host (#47). The deploy job digests it,
# transfers it to /data/projects/ai-antispam, and the guard recomputes the host digest
# after `up -d` - so a compose change here reaches the host or the run goes red. A local
# edit on the host is therefore overwritten by the next deploy.
services:
  ai-antispam:
    image: ${GHCR_IMAGE:-ghcr.io/leshchenko1979/ai-antispam}:${IMAGE_TAG:-main}
    # No container_name on purpose. A fixed name forces compose to rename the outgoing
    # container to "<old-id>_<service>" while recreating, and an interrupted recreate
    # leaves the replacement under that temporary name permanently: the deploy guard then
    # fails on a deploy that shipped, every monitor that names the container breaks, and a
    # later recreate can hard-fail with a name Conflict (all reproduced 2026-09-25).
    # Compose's own project-service-N name is stable across recreates, and the service
    # network alias "ai-antispam" - which is what Traefik dials - is unaffected.
    # aiogram 3.30 alone needs ~234 MiB (it compiles the entire Bot API as
    # pydantic models); idle footprint is ~293 MiB. A 256mb limit caused an OOM
    # crash-loop (RestartCount=9) -> webhook retries -> "duplicate taps".
    # See docs/memos/2026-08-01-aiogram-memory-memo.md. Do not lower below 512mb.
    mem_limit: 512mb
    mem_reservation: 128mb
    cpus: 0.5
    restart: unless-stopped
    # The app's own graceful shutdown budget is 5s (Telegram log handler) + 5s (detached
    # verdict drain) + the closing TaskGroup, so it can reach docker's default 10s stop
    # grace with no headroom. When it did, dockerd force-killed the container, compose's
    # remove collided ("removal of container ... is already in progress"), `up -d` aborted
    # mid-recreate and the replacement kept its temporary "<replaced-id>_ai-antispam" name
    # -> a red deploy that had in fact shipped the image (2026-09-25). 30s lets it finish.
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      # LLM ROUTING IS DEPLOY-CONTROLLED AND LIVES HERE, NOT IN .env.
      # `.env` is untracked and the deploy job syncs docker-compose.yml ONLY, so a
      # routing value kept in .env can never be shipped - it drifts silently and the
      # container keeps running the old target. Measured 2026-09-26: .env.example had
      # named the ai-gateway `ai-antispam` route since the CI commit, while the host's
      # .env still said llm.l1979.ru/`auto`, so the classifier ran against a gateway
      # whose only live channel was returning 503 no-capacity - 47% of gateway calls
      # failed and the OpenRouter fallback absorbed the rest.
      # These two are non-secret; the credential (CUSTOM_GATEWAY_API_KEY) stays in .env.
      # It must authenticate against API_BASE - they are a PAIR.
      - API_BASE=https://ai-gateway.l1979.ru/v1
      - CUSTOM_GATEWAY_MODEL=ai-antispam
    networks:
      - traefik-public
    volumes:
      - ${LOGS_DIR:-/home/${REMOTE_USER:-root}/logs}:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 1
      start_period: 60s

networks:
  traefik-public:
    external: true