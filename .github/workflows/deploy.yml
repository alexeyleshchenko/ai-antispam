name: Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
      - 'uv.lock'
      - 'config.yaml'
      - 'certs/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  BOT_TOKEN: "123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ0123456789"

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Cache test artifacts
        uses: actions/cache@v4
        with:
          path: |
            .pytest_cache
            .ruff_cache
            .mypy_cache
          key: test-cache-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: |
            test-cache-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            test-cache-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Lint
        run: uvx ruff check src

      - name: Type check
        run: uvx ty check src

      - name: Run tests
        run: USE_SQLITE_TESTS=true uv run pytest --ignore=tests/integration -v --tb=short -x

      - name: Set image repo output
        id: vars
        run: |
          owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "image_repo=ghcr.io/${owner_lc}/ai-antispam" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
            BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image_repo }}:main
            ${{ steps.vars.outputs.image_repo }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    env:
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Half 1 of #47: docker-compose.yml IS in on.push.paths, so a compose change
      # triggers a full build+deploy - but the deploy ran against the HOST's copy and
      # nothing compared the two. A compose change therefore deployed nothing and the
      # guard went GREEN. Digest the repo's spec here and ship it to the host.
      - name: Digest the deploy spec
        id: spec
        run: |
          set -euo pipefail
          sha=$(sha256sum docker-compose.yml | awk '{print $1}')
          b64=$(base64 -w0 docker-compose.yml)
          [ -n "$sha" ] && [ -n "$b64" ]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "b64=$b64" >> "$GITHUB_OUTPUT"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        env:
          COMPOSE_B64: ${{ steps.spec.outputs.b64 }}
          COMPOSE_SHA: ${{ steps.spec.outputs.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 15m
          envs: GHCR_PULL_TOKEN,GHCR_PULL_USER,COMPOSE_B64,COMPOSE_SHA
          script: |
            set -euo pipefail
            cd /data/projects/ai-antispam

            # --- deploy-spec sync (#47, half 1) --------------------------------
            # Refuse to touch the spec on an empty payload: a zero-byte write here
            # would be read by the `docker compose up -d` on the very next line.
            [ -n "${COMPOSE_B64:-}" ] || { echo "FATAL: COMPOSE_B64 empty - refusing to touch the deploy spec"; exit 1; }
            [ -n "${COMPOSE_SHA:-}" ] || { echo "FATAL: COMPOSE_SHA empty - refusing to touch the deploy spec"; exit 1; }
            # compose.yaml / compose.yml / docker-compose.yaml outrank docker-compose.yml,
            # so a leftover shadow file would silently win over the spec we just wrote.
            for shadow in compose.yaml compose.yml docker-compose.yaml; do
              if [ -f "$shadow" ]; then
                echo "FATAL: $shadow shadows docker-compose.yml (higher compose precedence)"; exit 1
              fi
            done
            if [ -f docker-compose.yml ]; then
              HOST_SHA=$(sha256sum docker-compose.yml | awk '{print $1}')
            else
              HOST_SHA=absent
            fi
            if [ "$HOST_SHA" != "$COMPOSE_SHA" ]; then
              TMP=$(mktemp ./docker-compose.yml.tmp.XXXXXX)
              printf '%s' "$COMPOSE_B64" | base64 -d > "$TMP"
              GOT_SHA=$(sha256sum "$TMP" | awk '{print $1}')
              if [ "$GOT_SHA" != "$COMPOSE_SHA" ]; then
                rm -f "$TMP"
                echo "FATAL: transferred deploy spec digests $GOT_SHA, repo says $COMPOSE_SHA - host spec left untouched"; exit 1
              fi
              mv "$TMP" docker-compose.yml
              echo "deploy spec: CHANGED $HOST_SHA -> $COMPOSE_SHA"
            else
              echo "deploy spec: unchanged ($COMPOSE_SHA)"
            fi

            if [ -n "${GHCR_PULL_TOKEN:-}" ] && [ -n "${GHCR_PULL_USER:-}" ]; then
              echo "${GHCR_PULL_TOKEN:-}" | docker login ghcr.io -u "${GHCR_PULL_USER:-}" --password-stdin
            fi
            docker compose pull && docker compose up -d
            # deploy guard: fail loud instead of a green no-op (stale-tag incident 2026-08-23..09-01)
            # Resolve the container from COMPOSE, never by container_name: when a recreate does
            # not complete, compose leaves the replacement under a temporary
            # "<replaced-container-id>_<service>" name, so `docker inspect ai-antispam` fails on
            # a container that is in fact running the right image (2026-09-25).
            CID=$(docker compose ps -q ai-antispam | head -1)
            [ -n "$CID" ] || { echo "FATAL: no running container for service ai-antispam"; exit 1; }
            WANT=$(docker compose images -q ai-antispam)
            HAVE=$(docker inspect -f '{{.Image}}' "$CID" | cut -c8-)
            RUNNING=$(docker inspect -f '{{.Config.Image}}' "$CID")
            EXPECT="ghcr.io/alexeyleshchenko/ai-antispam:main"
            [ "$RUNNING" = "$EXPECT" ] || { echo "FATAL: container runs $RUNNING, expected $EXPECT"; exit 1; }
            [ "$WANT" = "$HAVE" ] || { echo "FATAL: container image stale (compose pulled $WANT, container runs $HAVE)"; exit 1; }
            echo "deploy guard: OK ($RUNNING)"
            # --- deploy-spec guard (#47, half 2) -------------------------------
            # Green must mean the DEPLOYMENT SPEC is current, not only the image.
            NOW_SHA=$(sha256sum docker-compose.yml | awk '{print $1}')
            [ "$NOW_SHA" = "$COMPOSE_SHA" ] || { echo "FATAL: host deploy spec $NOW_SHA != repo $COMPOSE_SHA"; exit 1; }
            echo "deploy spec: verified ($NOW_SHA)"

      - name: Prune old images
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 5m
          script: |
            docker images --format '{{.ID}} {{.Repository}}:{{.Tag}}' |
              grep 'ghcr.io/alexeyleshchenko/ai-antispam' |
              grep -v ':main$' | awk '{print $1}' | xargs -r docker rmi -f
