name: TEMP - pull-access probe (delete after use)

# Temporary, single-purpose probe for the image-source move (owner ruling
# 2026-09-25: canonical account = leshchenko1979).
#
# Question it answers: can the credential pair GHCR_PULL_USER / GHCR_PULL_TOKEN
# that the DEPLOY job already holds read a PRIVATE package under
# ghcr.io/leshchenko1979/ai-antispam ?
#
# The host currently pulls ghcr.io/alexeyleshchenko/ai-antispam:main and run
# 36163556995 proved that tag is readable with these same secrets. That does NOT
# settle the canonical account's package, so switching the host default without
# this probe risks a production pull failure on the next push.
#
# Touches nothing: no SSH, no compose, no container. Runs on the ephemeral
# runner only. Prints no secret values - only pass/fail per image.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
    steps:
      - name: Login to GHCR
        run: |
          set -euo pipefail
          if [ -z "${GHCR_PULL_TOKEN:-}" ] || [ -z "${GHCR_PULL_USER:-}" ]; then
            echo "RESULT: secrets absent in this repository"
            exit 2
          fi
          printf '%s' "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_PULL_USER" --password-stdin
          echo "login: ok (user identity not printed)"

      - name: Probe both packages
        run: |
          set -uo pipefail
          rc_all=0
          for img in ghcr.io/leshchenko1979/ai-antispam:main ghcr.io/alexeyleshchenko/ai-antispam:main; do
            if docker manifest inspect "$img" >/dev/null 2>/tmp/mi.err; then
              echo "READABLE: $img"
            else
              echo "DENIED:   $img"
              sed -n '1,3p' /tmp/mi.err
              rc_all=1
            fi
          done
          echo "---"
          echo "PROBE_EXIT=$rc_all  (0 = canonical package readable, move is safe)"
          exit $rc_all
