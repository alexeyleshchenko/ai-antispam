name: Deploy Landing Page

on:
  push:
    branches: [ main ]
    paths: [ 'landing_page/**', '.github/workflows/deploy_landing.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Setup Node.js
      uses: actions/setup-node@main
      with:
        node-version: 'latest'

    - name: Install dependencies
      working-directory: ./landing_page
      run: npm install

    - name: Build with cache busting
      working-directory: ./landing_page
      run: npm run build

    - name: Create .nojekyll for GitHub Pages
      working-directory: ./landing_page/dist
      run: touch .nojekyll

    - name: Set Custom Domain
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        curl -fsSL -X PUT \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/${{ github.repository }}/pages \
          -d '{"cname": "ai-antispam.ru"}' || true

    - name: Setup Pages
      uses: actions/configure-pages@main

    - name: Upload artifact
      uses: actions/upload-pages-artifact@main
      with:
        path: ./landing_page/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@main