# This file is a port of the bot's prompt for private messages.
# It should not contain any sensitive information.

pricing:
  initial_credits: 100  # Начальные кредиты для новых пользователей
  approve_price: 1      # Стоимость одобрения нового участника
  delete_price: 1       # Стоимость удаления спама
  skip_price: 0         # Стоимость пропуска (всегда 0)

billing:
  low_balance_threshold: 50   # Stars below which "week ahead" warning applies
  depletion_grace_days: 7     # Days from depletion to leaving groups
  no_rights_grace_days: 7     # Days before leaving groups where bot has no required rights
  warn_day_after: true        # Day 1: "bot leaves groups in 7 days"
  warn_day_before: true       # Day 6: "bot leaves tomorrow"

cache:
  message_lookup_ttl_days: 7   # Lookup cache retention (admin forwards)
  message_history_ttl_days: 7  # Chat history retention
  verdict_ttl_days: 7              # classification_verdicts retention
  verdict_pending_stale_minutes: 15 # pending rows older than this are presumed dead
  # Retry of a FAILED classification. The webhook answers 503 for a failed row,
  # so Telegram redelivers and a later delivery reclaims it and classifies
  # again. Bounded twice: the cooldown is the backoff between attempts, and the
  # attempt cap is what finally stops the redelivery loop.
  verdict_retry_attempts: 3        # total attempts before giving up (1 = no retry)
  verdict_retry_cooldown_seconds: 60 # minimum wait between attempts
  pending_spam_ttl_days: 7     # Pending spam examples before cleanup

# Confidence threshold (0-100): spam/not-spam with confidence >= this is high-confidence.
# High-confidence spam: may auto-delete (if admins allow). Low-confidence: notify only, admin confirms.
# High-confidence not-spam: auto-approve. Low-confidence not-spam: send for review.
# Examples: limit and ham share for prompt (prefer most recent within each category).
# LLM routing — the classification path calls the provider pool DIRECTLY.
#
# 2026-10-01 (owner directive: "the timeout ladders are wrong ... lift some
# self-inflicted requirements"). The gateway hop is REMOVED from the
# classification path. It added three walls — the gateway's per-step timeout,
# its route timeout, and the app's client leg — each of which had to reconcile
# with the others and with the app's own per-attempt budget; twice in three days
# an edit to one of them took the classifier leg down. With the inferhub-only
# directive the route pointed at the same provider the app already falls back
# to, so the hop bought nothing. See
# docs/memos/2026-10-01-collapse-the-classifier-timeout-ladder.md
#
# The old arithmetic here pinned the gateway leg at <=15s from BOTH sides:
# tests/test_classifier_fallback_budget.py required per_attempt >= 15s, and
# budget + the 10s reserve had to fit the 55s webhook. Together those gave
# gateway + 15n <= 45, so with n=2 the gateway leg could never exceed 15s — and
# the gateway route's steps then had to sum under a wall no latency had ever
# been measured against. Every wall was load-bearing for the next; none was
# derived from a measurement. That is the defect this change removes.
llm:
  # 2026-10-02 (owner order): "Your strict timeouts break the process. Remove
  # them. Late classification is better than timeouts with no classification at
  # all."
  #
  # budget_seconds is raised to the platform maximum the webhook guard allows
  # (budget + reserve <= system.webhook_timeout, i.e. 45 + 10 <= 55), and the
  # DERIVED per-attempt slice is no longer the wall. An attempt now gets the
  # whole remainder of the request's own deadline instead of budget/len(models);
  # see the note in src/app/spam/spam_classifier.py. The derived value is kept
  # (and still guarded by tests/test_classifier_fallback_budget.py) as the
  # floor a fallback leg needs, not as the runtime wall.
  budget_seconds: 45           # total classifier LLM budget; reserve 10s for the webhook
  gateway_enabled: false       # the gateway hop is out of the classification path
  gateway_timeout_seconds: 0   # 0 = no gateway leg; the pool owns the whole budget
  route_timeout_seconds: 30    # non-classification LLM legs (topic derivation, admin DM)
  #
  # Model choice is MEASURED, not assumed. Measured 2026-09-29 at production
  # parity — the real 27,743-char prompt with the real production spam message,
  # 6 calls each:
  #   ag/gemini-3.7-flash-high   p50 7.50s  max 10.66s  0/6 over a 15s leg
  #   cb/deepseek-v4.1-flash     p50 7.94s  max 12.46s  0/6 over a 15s leg
  #   ag/gemini-3.8-flash-high   p50 7.74s  max 12.59s  0/6 over a 15s leg
  #   cp/zai/glm-5.3-flash       p50 8.61s  max 12.77s  0/6 over a 15s leg
  #   cp/cline-pass/deepseek-v4.1-flash p50 10.11s max 20.08s  1/6 OVER - rejected
  #   ali/deepseek-v4-flash-0731       21.6s+ on every call    - rejected
  #   cp/cline-pass/deepseek-v4-flash  22.5-31.5s on every call - rejected
  # The pair deliberately keeps TWO provider prefixes (ag/gemini, cb/deepseek)
  # so one upstream outage cannot empty the pool.
  #
  # Both are inferhub aliases: the endpoint is FALLBACK_API_BASE (set in
  # docker-compose.yml) with credential FALLBACK_API_KEY in .env. OpenRouter's
  # free models returned 429 (free-models-per-day cap) and every paid model
  # returned 404 "Model blocked by guardrail" — 10 probed, all blocked — so the
  # tier was 0% available and every gateway timeout became a lost message.
  #
  # ling is BANNED, both ids: ling-3.0-flash-fin (owner ban 2026-09-25) and
  # ling-3.0-flash-sante (owner re-confirmed 2026-10-01: "it doesn't reliably
  # produce reason in Russian"). The prompt ALREADY mandates Russian
  # (locales/ru.yaml:377 "Пиши по-русски."), so this is model non-compliance,
  # not a missing instruction. Both are pinned in BANNED_MODELS so a later
  # config edit cannot quietly re-add them.
  # See docs/memos/2026-09-25-fallback-pool-language-and-accuracy.md
  openrouter_models:
    - ag/gemini-3.7-flash-high
    - cb/deepseek-v4.1-flash

spam:
  high_confidence_threshold: 90
  probation_min_events: 3  # Approved members need this many moderated events before trusted skip
  examples_limit: 40        # Max examples in prompt
  examples_ham_ratio: 0.25   # 25% ham, rest is spam
  recent_posts_limit: 5      # Number of recent channel posts to fetch for analysis
  # Chat-topic scan (/scan): fetch cap for recent messages; LLM-input budget is
  # capped separately by topic_max_message_chars / topic_max_total_chars.
  topic_scan_limit: 30
  topic_max_message_chars: 500    # Per-message truncation (head kept)
  topic_max_total_chars: 16000    # Total corpus budget ~= 4K tokens (fits any model)
  notify_spammers_via_mcp: false  # Enable MTProto promo DMs to blocked spammers/channel admins

system:
  admin_chat_id: 133526395  # ID администратора для уведомлений
  bot_username: "ai_spam_blocker_bot"  # Bot username for deep links
  project_channel: "https://t.me/ai_antispam"  # URL канала проекта
  project_website: "https://ai-antispam.ru"  # URL сайта проекта
  spam_guide_url: "https://t.me/ai_antispam/7"  # URL гайда по спаму
  setup_guide_url: "https://t.me/ai_antispam/14"  # URL гайда по настройке
  affiliate_url: "https://telegram.org/tour/affiliate-programs/"  # URL партнерской программы
  webhook_timeout: 55  # Таймаут вебхука в секундах
