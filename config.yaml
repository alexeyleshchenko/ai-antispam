# This file is a port of the bot's prompt for private messages.
# It should not contain any sensitive information.

pricing:
  initial_credits: 100  # Начальные кредиты для новых пользователей
  approve_price: 1      # Стоимость одобрения нового участника
  delete_price: 1       # Стоимость удаления спама
  skip_price: 0         # Стоимость пропуска (всегда 0)

billing:
  low_balance_threshold: 50   # Stars below which "week ahead" warning applies
  depletion_grace_days: 7     # Days from depletion to leaving groups
  no_rights_grace_days: 7     # Days before leaving groups where bot has no required rights
  warn_day_after: true        # Day 1: "bot leaves groups in 7 days"
  warn_day_before: true       # Day 6: "bot leaves tomorrow"

cache:
  message_lookup_ttl_days: 7   # Lookup cache retention (admin forwards)
  message_history_ttl_days: 7  # Chat history retention
  verdict_ttl_days: 7              # classification_verdicts retention
  verdict_pending_stale_minutes: 15 # pending rows older than this are presumed dead
  pending_spam_ttl_days: 7     # Pending spam examples before cleanup

# Confidence threshold (0-100): spam/not-spam with confidence >= this is high-confidence.
# High-confidence spam: may auto-delete (if admins allow). Low-confidence: notify only, admin confirms.
# High-confidence not-spam: auto-approve. Low-confidence not-spam: send for review.
# Examples: limit and ham share for prompt (prefer most recent within each category).
# LLM routing — keep in sync with gateway route "ai-antispam" (OpenRouter fallback steps).
llm:
  budget_seconds: 45           # total classifier LLM budget; reserve 10s for the webhook
  gateway_timeout_seconds: 15  # primary gateway leg; classifier-only budget
  route_timeout_seconds: 30    # non-classification LLM legs (topic derivation, admin DM)
  # Per-attempt budget is DERIVED: (budget - gateway) / len(models).
  # The gateway leg runs p50 3.3s / p90 5.2s / max 11.8s over 20 calls, so 15s
  # covers its real ceiling. Two models behind it give 15.0s per attempt; adding
  # a third would cut every attempt to 10.0s, which the slowest survivor's
  # measured latency does not fit - the guard refuses it.
  #
  # Model choice is MEASURED, not assumed. At production parity on 2026-09-24
  # (deployed container, the app's own prompt + owner-scoped corpus, tools
  # required, 15.0s budget): nex-n2.5-mini 8/8, p50 2.1s, max 5.5s;
  # dots-3-note-preview 6/8, p50 8.6s, max 9.5s. The two nvidia/nemotron models
  # previously configured managed 1/8 each - they time out or return output
  # pydantic-ai cannot parse, which is what made this tier rescue only 3 of 30
  # gateway failures (10%). Both survivors come from different providers (Nex AGI,
  # AtlasCloud), so one provider's bad day cannot empty the pool - the failure
  # mode of the previous list, which was three models from a single family.
  # See docs/memos/2026-09-24-llm-fallback-model-selection.md
  openrouter_models:
    - inclusionai/ling-3.0-flash-fin:free
    - dots-studio/dots-3-note-preview:free

spam:
  high_confidence_threshold: 90
  probation_min_events: 3  # Approved members need this many moderated events before trusted skip
  examples_limit: 40        # Max examples in prompt
  examples_ham_ratio: 0.25   # 25% ham, rest is spam
  recent_posts_limit: 5      # Number of recent channel posts to fetch for analysis
  # Chat-topic scan (/scan): fetch cap for recent messages; LLM-input budget is
  # capped separately by topic_max_message_chars / topic_max_total_chars.
  topic_scan_limit: 30
  topic_max_message_chars: 500    # Per-message truncation (head kept)
  topic_max_total_chars: 16000    # Total corpus budget ~= 4K tokens (fits any model)
  notify_spammers_via_mcp: false  # Enable MTProto promo DMs to blocked spammers/channel admins

system:
  admin_chat_id: 133526395  # ID администратора для уведомлений
  bot_username: "ai_spam_blocker_bot"  # Bot username for deep links
  project_channel: "https://t.me/ai_antispam"  # URL канала проекта
  project_website: "https://ai-antispam.ru"  # URL сайта проекта
  spam_guide_url: "https://t.me/ai_antispam/7"  # URL гайда по спаму
  setup_guide_url: "https://t.me/ai_antispam/14"  # URL гайда по настройке
  affiliate_url: "https://telegram.org/tour/affiliate-programs/"  # URL партнерской программы
  webhook_timeout: 55  # Таймаут вебхука в секундах
